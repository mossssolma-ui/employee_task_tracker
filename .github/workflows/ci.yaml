name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install poetry
        run: pipx install poetry

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml'
          cache: poetry

      - name: Install dependencies
        run: poetry install --with lint

      - name: Run linters checks
        run: poetry run flake8 .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.1-alpine
        env:
          POSTGRES_DB: employee_task_tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    env:
      SECRET_KEY: test
      DEBUG: "true"
      POSTGRES_ENGINE: django.db.backends.postgresql
      POSTGRES_NAME: employee_task_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v7

      - name: Install poetry
        run: pipx install poetry

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml'
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: Run tests and coverage
        run: |
          poetry run coverage run manage.py test
          poetry run coverage xml

  build-and-deploy:
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/django-example:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/django-example:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            
            git fetch origin
            git reset --hard origin/main
            
            docker compose -f docker-compose.deploy.yaml --env-file .env down
            docker compose -f docker-compose.deploy.yaml --env-file .env pull
            
            docker compose -f docker-compose.deploy.yaml --env-file .env run --rm migrations
            docker compose -f docker-compose.deploy.yaml --env-file .env run --rm static_collector
            
            docker compose -f docker-compose.deploy.yaml --env-file .env up -d
            
            docker image prune -f